      property="og:description"
      content="Organize várias contas TikTok, planeje vídeos e carrosséis em lote e acompanhe suas publicações com o AutoClip."
    />
    <meta property="og:url" content="https://autoclipe.vercel.app/" />
    <meta name="twitter:card" content="summary" />

      name="twitter:title"

    <link rel="manifest" href="/site.webmanifest" />
    <title>AutoClip | Agendamento de vídeos e múltiplas contas TikTok</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita flash claro/escuro).
      (function () {
        try {
          var t = localStorage.getItem("autoclip-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", dark);
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
